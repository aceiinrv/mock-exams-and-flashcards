<script>
const MOD=["Threats, Vulnerabilities & Attacks","Securing Networks","Attacking the Foundation","Attacking What We Do","Wireless Network Communication","Network Security Infrastructure"];
// [module, question, [correct, wrong, wrong, wrong], explanation]
const Q=[
[1,"Anything that could potentially cause harm to a system, network or data is called a:",["Threat","Vulnerability","Exploit","Backdoor"],"A threat is a potential cause of harm. It doesn't mean an attack has already happened."],
[1,"Which malware spreads by itself through network vulnerabilities, without attaching to another file?",["Worm","Virus","Trojan horse","Logic bomb"],"A worm replicates on its own. A virus must attach to a file and spread when that file runs."],
[1,"Malicious code that stays inactive until a set date or condition occurs is a:",["Logic bomb","Rootkit","Keylogger","Worm"],"A logic bomb waits for its trigger (a date, a database entry) before doing damage."],
[1,"An attacker watches a victim type an ATM PIN. This is:",["Shoulder surfing","Dumpster diving","Tailgating","Pharming"],"Shoulder surfing steals information by watching. Dumpster diving searches trash instead."],
[1,"Phishing aimed at high-profile people such as executives is called:",["Whaling","Vishing","Smishing","Pharming"],"Whaling targets 'big catches'. Vishing uses phone calls, smishing uses text messages."],
[1,"Phishing sent through SMS text messages is called:",["Smishing","Vishing","Whaling","Typosquatting"],"Smishing = SMS phishing. Vishing is phishing by voice."],
[1,"An attacker enters malicious statements into an input field the app doesn't validate. This is:",["SQL injection","Cross-site scripting","Buffer overflow","Replay attack"],"SQL injection abuses unvalidated input to run database commands. XSS runs scripts in a browser."],
[1,"Exploiting a vulnerability before the vendor has released a patch is a:",["Zero-day attack","Replay attack","Race condition","Algorithm attack"],"'Zero-day' means defenders have had essentially no time to fix the flaw."],
[1,"Which attack injects malicious scripts into a web page that run in the victim's browser?",["Cross-site scripting (XSS)","Directory traversal","DNS spoofing","MAC flooding"],"XSS runs attacker scripts in the browser and can steal cookies or session tokens."],
[1,"Writing more data into a memory buffer than it can hold is a:",["Buffer overflow","Race condition","Resource exhaustion","Privilege escalation"],"The extra data overwrites nearby memory, which can crash the system or give the attacker control."],
[2,"The likelihood that a threat will exploit a vulnerability and cause harm is:",["Risk","Threat","Exploit","Attack surface"],"Threat = what can cause harm, vulnerability = the weakness, risk = the chance the weakness is used."],
[2,"In the house analogy (burglar, unlocked door), the unlocked door is the:",["Vulnerability","Threat","Risk","Exploit"],"The burglar is the threat; the unlocked door is the weakness, i.e. the vulnerability."],
[2,"The total collection of vulnerabilities and access points an attacker can use is the:",["Attack surface","Attack vector","Exploit","Risk"],"The attack surface is all possible 'doors'. An attack vector is one path an attacker takes."],
[2,"The path or method a threat actor uses to reach a host or network (e.g. email, USB) is a(n):",["Attack vector","Attack surface","Indicator of attack","Risk"],"A vector is the route in. The surface is the full set of possible entry points."],
[2,"Buying cyber insurance to cover financial losses is an example of risk:",["Transfer","Acceptance","Avoidance","Reduction"],"Transfer shifts some or all of the risk to another party."],
[2,"A risk would cost more to fix than it would cause, so the organization does nothing. This is risk:",["Acceptance","Avoidance","Reduction","Transfer"],"Acceptance means living with a risk because dealing with it costs more."],
[2,"Which hacker uses their skills legally and with permission, e.g. for penetration testing?",["White hat","Black hat","Gray hat","Script kiddie"],"White hats are ethical hackers who are authorized to find vulnerabilities."],
[2,"An inexperienced attacker who relies on tools and scripts made by others is a:",["Script kiddie","Vulnerability broker","State-sponsored hacker","Hacktivist"],"Script kiddies use existing tools rather than creating their own."],
[2,"A threat actor motivated by political or social causes is a:",["Hacktivist","Cybercriminal","Script kiddie","Gray hat"],"Hacktivists leak data, publish messages or launch DDoS for a cause. Cybercriminals want money."],
[2,"An Indicator of Attack (IOA) focuses on:",["Attacker behavior and strategy","Evidence a breach already occurred","A known malware signature","A suspicious IP address"],"IOC = evidence after the fact (signatures, IPs, domains). IOA = how the attacker is attacking."],
[3,"What key weakness of IP makes address spoofing possible?",["It doesn't verify the source address","It always fragments packets","It requires a handshake","It only uses 32-bit addresses"],"IP delivers packets but doesn't check that the sender's address is real."],
[3,"What happens when an IPv4 packet's TTL reaches zero?",["The router discards it","It's delivered anyway","It's fragmented","It's re-encrypted"],"Each router lowers TTL by 1; discarding at zero stops packets from looping forever."],
[3,"How many bits are in an IPv6 address?",["128","32","64","256"],"IPv6 uses 128-bit addresses. IPv4 uses 32-bit addresses."],
[3,"The IPv6 header field that replaces IPv4's TTL is:",["Hop Limit","Next Header","Flow Label","Traffic Class"],"TTL becomes Hop Limit, and Protocol becomes Next Header."],
[3,"Which ICMP message can redirect traffic through a compromised device, enabling MitM?",["ICMP Redirect","ICMP Echo Reply","ICMP Unreachable","ICMP Mask Reply"],"Redirects change the path traffic takes. Unreachable and mask replies mainly help reconnaissance."],
[3,"A Smurf attack is an example of a(n):",["Amplification and reflection attack","Session hijacking","ARP poisoning","Replay attack"],"It uses other systems to multiply and reflect traffic toward the victim."],
[3,"What is the correct order of the TCP three-way handshake?",["SYN, SYN-ACK, ACK","ACK, SYN, SYN-ACK","SYN, ACK, SYN-ACK","SYN-ACK, SYN, ACK"],"The client sends SYN, the server replies SYN-ACK, and the client confirms with ACK."],
[3,"In a TCP SYN flood, the attacker:",["Sends many spoofed SYNs and never completes handshakes","Takes over an authenticated session","Sends floods of UDP packets","Poisons the target's ARP cache"],"The server keeps waiting for the final ACK until its resources run out."],
[3,"Which transport protocol is connectionless with low overhead, suited to VoIP and streaming?",["UDP","TCP","ICMP","IPv6"],"UDP skips handshakes, retransmission and flow control, so it's fast and lightweight."],
[3,"An attacker takes over an authenticated connection by spoofing the IP and predicting sequence numbers. This is TCP:",["Session hijacking","SYN flood","Session termination","Reflection"],"Hijacking takes control of an existing session. A SYN flood only exhausts resources."],
[4,"What does ARP do on a local network?",["Finds the MAC address for a known IP","Translates domain names to IPs","Assigns IP addresses","Encrypts local traffic"],"ARP asks 'who has this IP?' and gets a MAC address back. Name translation is DNS."],
[4,"In ARP cache poisoning, the attacker links their own MAC address to the IP of the:",["Default gateway","Attacker's own router","DHCP lease","DNS root server"],"Traffic then flows through the attacker, enabling a MitM attack."],
[4,"Active ARP poisoning differs from passive because the attacker:",["Modifies traffic or injects data","Only steals information","Only scans ports","Blocks all traffic"],"Passive = steal confidential information. Active = modify or inject."],
[4,"False DNS records placed in a resolver's cache to redirect users is DNS:",["Cache poisoning","Tunneling","Fast flux","Amplification"],"Poisoned cache entries send users to attacker-controlled sites."],
[4,"Hiding data or malware communication inside DNS queries is called DNS:",["Tunneling","Amplification","Cache poisoning","Resource utilization"],"Data is encoded into pieces and carried in DNS queries to avoid detection."],
[4,"Rapidly changing the IP addresses tied to a malicious domain is known as:",["Fast flux","Domain shadowing","DNS tunneling","Typosquatting"],"Fast flux hides malicious infrastructure. Domain shadowing hides subdomains in a hijacked domain."],
[4,"An HTTP status code starting with 5xx means:",["Server error","Client error","Redirection","Success"],"1xx info, 2xx success, 3xx redirect, 4xx client error, 5xx server error."],
[4,"Using look-alike characters to make fake text or addresses look legitimate is a:",["Homoglyph","Backdoor","Open relay","Logic bomb"],"A homoglyph swaps in characters that look identical or similar to the real ones."],
[4,"Which worm-mitigation phase involves patching vulnerable systems?",["Inoculation","Containment","Quarantine","Treatment"],"Contain, then inoculate (patch), quarantine infected machines, and finally treat (clean)."],
[4,"Requiring a password plus a one-time code is an example of:",["Multifactor authentication","Port security","Minimum trust","DHCP snooping"],"MFA requires two or more independent proofs of identity."],
[5,"What is the main difference between WLANs and wired LANs?",["Wireless uses radio signals instead of cables","Wireless can't use IP","Wireless doesn't use frames","Wireless needs no security"],"The physical medium is radio frequency rather than cables."],
[5,"Why do WLANs use CSMA/CA (collision avoidance) instead of collision detection?",["Devices can't listen while transmitting","Wi-Fi never has collisions","Frames are too large","Cables are required"],"Wireless devices can't detect collisions like wired Ethernet, so they listen first and avoid them."],
[5,"In passive discovery, the access point:",["Broadcasts beacon frames","Waits for probe requests","Sends only RTS frames","Queries a RADIUS server"],"Beacons announce the SSID, supported standards and security settings."],
[5,"Which discovery method has the client send a probe request for a particular SSID?",["Active discovery","Passive discovery","Beaconing","SSID cloaking"],"In active discovery the client asks and the AP responds."],
[5,"A Wireless LAN Controller (WLC) is used to:",["Centrally manage multiple access points","Encrypt traffic with TKIP","Filter MACs on one AP","Broadcast beacons"],"A WLC manages lightweight APs from one place, which makes configuration and monitoring easier."],
[5,"An unauthorized wireless access point connected to an organization's network is a:",["Rogue AP","LWAP","WLC","Guest SSID"],"A rogue AP can expose network resources. An evil twin is a rogue AP that also copies a real SSID."],
[5,"A fake AP that copies a legitimate SSID, often with a stronger signal, is a(n):",["Evil twin","LWAP","Cloaked SSID","MAC filter"],"Clients may join the stronger fake and the attacker can intercept their traffic."],
[5,"SSID cloaking:",["Disables the SSID broadcast","Encrypts the SSID","Blocks specific MAC addresses","Replaces the password"],"Users must enter the network name manually to connect."],
[5,"Which encryption method does WPA2 use?",["AES","TKIP","RC4","MD5"],"WPA used TKIP to improve on WEP. WPA2 moved to the stronger AES."],
[5,"WPA2 Enterprise authenticates users with:",["RADIUS with 802.1X/EAP","A pre-shared key","MAC filtering","SSID hiding"],"WPA2 Personal uses a shared password (PSK). Enterprise uses centralized authentication."],
[6,"Which AAA function decides what an authenticated user is allowed to do?",["Authorization","Authentication","Accounting","Encryption"],"Authentication = who are you? Authorization = what can you do? Accounting = what did you do?"],
[6,"A DMZ is best described as a:",["Zone for public-facing servers between networks","Encrypted tunnel between sites","Server that collects logs","Controller for wireless APs"],"It lets outside users reach certain servers without exposing the internal network."],
[6,"What is the key difference between an IPS and an IDS?",["An IPS can stop malicious traffic","An IDS can stop malicious traffic","An IPS never raises alerts","An IDS only runs on hosts"],"IDS = detect and alert. IPS = detect and prevent."],
[6,"A firewall that tracks active connections in a state table is:",["Stateful","Packet-filtering only","A standard ACL","A syslog server"],"Stateful firewalls remember connections, so they make smarter decisions than simple packet filters."],
[6,"A standard IPv4 ACL mainly filters on the:",["Source IP address","Destination port","Protocol type","Destination IP"],"Extended ACLs add protocol, destination IP and ports."],
[6,"Which feature copies network traffic to a monitoring device such as an IDS?",["Port mirroring","NetFlow","Syslog","NTP"],"Port mirroring sends a copy of traffic to analyzers. NetFlow only gives flow statistics."],
[6,"Why is NTP important to security analysts?",["Shared accurate time lets them order events","It encrypts log files","It authenticates users","It blocks DoS traffic"],"If device clocks disagree, it's hard to tell what happened first during an incident."],
[6,"Which AAA function records what a user did and for how long?",["Accounting","Authentication","Authorization","Encryption"],"Accounting tracks resources accessed, changes made and usage."],
[6,"Compared with RADIUS, TACACS+:",["Uses TCP and encrypts the whole packet","Uses UDP and encrypts only the password","Combines authentication and authorization","Is the open RFC standard"],"RADIUS uses UDP, encrypts only the password and is the open standard. TACACS+ separates AAA."],
[6,"Which VPN type securely connects a headquarters to a branch office?",["Site-to-site VPN","Remote-access VPN","Clientless proxy","DMZ"],"Remote-access VPNs connect individual users. Site-to-site joins two networks."]
];
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let ex,i,score,R,ans;
function start(){
  const S=$('sh').checked,M=$('md').checked;
  let L=Q.map((q,n)=>({n,m:q[0],q:q[1],c:q[2][0],d:q[2].slice(1),e:q[3]}));
  if(S)L=sh(L);
  if(M)L.sort((a,b)=>a.m-b.m||(S?0:a.n-b.n));
  else if(!S)L.sort((a,b)=>(a.n%10)*6+(a.n/10|0)-((b.n%10)*6+(b.n/10|0)));
  L.forEach(x=>{if(S)x.o=sh([x.c,...x.d]);else{x.o=x.d.slice();x.o.splice((x.n*3+1)%4,0,x.c)}});
  ex=L;i=0;score=0;R={};show();
}
function show(){
  if(i>=ex.length)return done();
  const q=ex[i];ans=0;
  $('bar').style.width=i/ex.length*100+'%';
  $('st').textContent='Score '+score+'/'+i;
  $('main').innerHTML='<div class="tag">Module '+q.m+': '+MOD[q.m-1]+'</div><div class="n">Question '+(i+1)+' of '+ex.length+'</div><h2>'+q.q+'</h2>'+
    q.o.map((t,k)=>'<button class="o" data-k="'+k+'"><b>'+'ABCD'[k]+'.</b> '+t+'</button>').join('')+'<div id="fb"></div>';
  window.scrollTo(0,0);
}
function done(){
  $('bar').style.width='100%';
  $('st').textContent='Score '+score+'/'+ex.length;
  const p=Math.round(score/ex.length*100);
  $('main').innerHTML='<h2>Exam complete</h2><div class="big">'+score+' / '+ex.length+' ('+p+'%)</div><p>'+
    (p>=90?'Excellent work!':p>=75?'Good job. Review the questions you missed.':'Keep studying. Check the weaker modules below.')+'</p>'+
    MOD.map((n,k)=>{const r=R[k+1]||[0,0];return '<div class="row"><span>Module '+(k+1)+': '+n+'</span><b>'+r[0]+'/'+r[1]+'</b></div>'}).join('')+
    '<button class="p" id="again">Restart exam</button>';
  window.scrollTo(0,0);
}
$('main').onclick=e=>{
  if(e.target.closest('#again'))return start();
  if(e.target.closest('#nx')){i++;return show()}
  const b=e.target.closest('.o');
  if(!b||ans)return;ans=1;
  const q=ex[i],pick=q.o[b.dataset.k],ok=pick===q.c;
  (R[q.m]=R[q.m]||[0,0])[1]++;
  if(ok){score++;R[q.m][0]++}
  document.querySelectorAll('.o').forEach(x=>{x.disabled=true;if(q.o[x.dataset.k]===q.c)x.classList.add('ok')});
  if(!ok)b.classList.add('no');
  $('st').textContent='Score '+score+'/'+(i+1);
  $('fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'✓ Correct!':'✗ Not quite.')+'</b> '+
    (ok?'':'<b>'+pick+'</b> is incorrect. The right answer is <b>'+q.c+'</b>. ')+q.e+'</div>'+
    '<button class="p" id="nx">'+(i+1<ex.length?'Next question':'See results')+'</button>';
};
$('sh').onchange=$('md').onchange=$('rs').onclick=start;
start();
</script></body></html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEED 003 · Lesson 2.2 Mock LSQ#2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall-1:#e9e1cd; --wall-2:#d9cfb2;
    --wood-1:#6d4a31; --wood-2:#432b1a;
    --board-1:#24392c; --board-2:#1a2a21;
    --chalk:#f2eee1; --chalk-dim:#b9c2b6;
    --yellow:#e3bf5a; --blue:#79b0bd; --mint:#84c397; --coral:#e17766;
    --line: rgba(242,238,225,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.35), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(0,0,0,0.06), transparent 55%),
      linear-gradient(160deg, var(--wall-1), var(--wall-2));
    font-family:"IBM Plex Sans", sans-serif; color:#2b241a;
    display:flex; justify-content:center; align-items:flex-start;
    padding:36px 16px 60px;
  }
  .frame{
    width:100%; max-width:760px;
    background:linear-gradient(160deg, var(--wood-1), var(--wood-2));
    border-radius:16px; padding:16px;
    box-shadow: 0 40px 70px -30px rgba(30,18,8,0.5), 0 2px 0 rgba(255,255,255,0.10) inset, 0 -2px 0 rgba(0,0,0,0.25) inset;
  }
  .board{
    position:relative;
    background:radial-gradient(ellipse at 30% -10%, #2c4433 0%, var(--board-1) 45%, var(--board-2) 100%);
    border-radius:8px; padding:26px 24px 20px; color:var(--chalk);
    min-height:440px; overflow:hidden; box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
  }
  .board::before{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 3px 3px; opacity:0.5; pointer-events:none;
  }
  .tray{ display:flex; gap:8px; justify-content:center; padding-top:14px; }
  .chalk-dot{width:11px;height:7px;border-radius:2px; opacity:0.85; transform:rotate(-3deg);}

  .eyebrow{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--chalk-dim); margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .eyebrow .part-tag{ color:var(--chalk); font-weight:600; letter-spacing:0.02em; }
  .restart-link{ background:none;border:1px solid var(--line); color:var(--chalk-dim); font-family:inherit; font-size:12px; padding:5px 10px; border-radius:999px; cursor:pointer; transition:all .15s; }
  .restart-link:hover{ color:var(--chalk); border-color:var(--chalk-dim); }

  .progress-track{ height:5px; background:rgba(242,238,225,0.12); border-radius:999px; overflow:hidden; margin-bottom:18px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--blue), var(--mint)); border-radius:999px; transition:width .35s ease; }

  .timer-row{ display:flex; justify-content:flex-end; margin:-8px 0 10px; }
  .timer-wrap{ display:flex; align-items:center; gap:8px; color:var(--chalk-dim); font-size:12px; }
  .timer-ring-svg{ transform:rotate(-90deg); }
  .timer-ring-bg{ fill:none; stroke:rgba(242,238,225,0.15); stroke-width:4; }
  .timer-ring-fg{ fill:none; stroke:var(--yellow); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s; }
  .timer-num{ font-weight:600; font-size:12px; fill:var(--chalk); font-family:"IBM Plex Sans",sans-serif; }

  h1,h2,h3{ font-family:"Kalam", cursive; font-weight:700; margin:0; }
  .headline{ font-size:26px; line-height:1.3; }

  .prompt{ font-size:19px; line-height:1.5; margin:4px 0 20px; color:var(--chalk); }

  .options-col{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex; align-items:center; gap:12px; border:1.5px dashed var(--line);
    border-radius:9px; padding:12px 14px; background:rgba(242,238,225,0.02);
    cursor:pointer; transition:background .15s, border-color .15s, transform .1s;
    font-size:15px; color:var(--chalk);
  }
  .opt:hover:not(.locked-opt){ background:rgba(242,238,225,0.07); border-color:var(--chalk-dim); }
  .opt:active:not(.locked-opt){ transform:scale(0.99); }
  .opt .mark{ flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
  .opt-correct{ border-color:var(--mint); background:rgba(132,195,151,0.14); }
  .opt-correct .mark{ border-color:var(--mint); background:var(--mint); color:#12261a; }

  ...ID.map((x,i)=>({ ...x, part:'id', partLabel:'Part II: Identification', partShort:'Part II', numberInPart:i+1, totalInPart:ID.length })),
];
const TOTAL = ALL.length;                 // 70
const MC_COUNT = MC.length, ID_COUNT = ID.length; // 40, 30
const MC_END = MC_COUNT - 1;               // index 39
const LAST = TOTAL - 1;                    // index 69
const MC_TIME = 12;                        // seconds per Multiple Choice question (40 x 12s = 8 minutes)
const ID_TIME = 15;                        // seconds per Identification question (30 x 15s = 7.5 minutes)
function timeLimitFor(q){ return q.part==='mc' ? MC_TIME : ID_TIME; }

/* ===================== STATE ===================== */
function freshState(){
  return {
    screen:'start', currentIndex:0, answers:new Array(TOTAL).fill(null),
    locked:false, timerEnabled:true, timeLeft:MC_TIME, timerId:null,
  };
}
let state = freshState();

/* ===================== HELPERS ===================== */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normalize(str){
  let s = (str||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,;:!?]+$/,'');
  s = s.replace(/^the\s+/, '');
  return s;
}
function scoreForPart(part){
  let correct=0;
  ALL.forEach((q,i)=>{
    if(q.part!==part) return;
    const a = state.answers[i];
    if(a && a.status==='correct') correct++;
  });
  const total = part==='mc'?MC_COUNT:ID_COUNT;
  return {correct, total};
}
function scoreForTag(tag){
  let correct=0, total=0;
  ALL.forEach((q,i)=>{
    if(q.tag!==tag) return;
    total++;
    const a = state.answers[i];
    if(a && a.status==='correct') correct++;
  });
  return {correct, total};
}
function overallScore(){
  let correct=0;
  state.answers.forEach(a=>{ if(a && a.status==='correct') correct++; });
  return {correct, total:TOTAL};
}
function pct(c,t){ return t? Math.round((c/t)*100) : 0; }

/* ===================== TIMER ===================== */
function startTimer(){
  clearInterval(state.timerId);
  const q = ALL[state.currentIndex];
  state.timeLeft = timeLimitFor(q);
  updateTimerDOM();
  state.timerId = setInterval(tick, 1000);
}
function tick(){
  state.timeLeft--;
  updateTimerDOM();
  if(state.timeLeft<=0){ clearInterval(state.timerId); handleTimeout(); }
}
function updateTimerDOM(){
  const secEl = document.getElementById('timerSeconds');
  const ring = document.getElementById('timerRingFg');
  const q = ALL[state.currentIndex];
  const max = timeLimitFor(q);
  if(secEl) secEl.textContent = Math.max(state.timeLeft,0);
  if(ring){
    const circumference = 2*Math.PI*26;
    const frac = Math.max(state.timeLeft,0)/max;
    const threshold = Math.ceil(max/3);
    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = circumference*(1-frac);
    ring.style.stroke = state.timeLeft<=threshold ? 'var(--coral)' : 'var(--yellow)';
  }
}
function handleTimeout(){
  if(state.locked) return;
  state.locked = true;
  const q = ALL[state.currentIndex];
  state.answers[state.currentIndex] = { status:'unanswered', part:q.part };
  render();
}

/* ===================== ACTIONS ===================== */
function startQuiz(){
  const toggle = document.getElementById('timerToggle');
  state.timerEnabled = toggle ? toggle.checked : true;
  state.screen='quiz'; state.currentIndex=0; state.locked=false;
  state.answers=new Array(TOTAL).fill(null);
  render();
  if(state.timerEnabled) startTimer();
}
function selectOption(i){
  if(state.locked) return;
  clearInterval(state.timerId);
  state.locked=true;
  const q = ALL[state.currentIndex];
  const correct = i===q.correct;
  state.answers[state.currentIndex] = { status: correct?'correct':'incorrect', userIndex:i, part:q.part };
  render();
}
function submitIdentification(){
  if(state.locked) return;
  const input = document.getElementById('idInput');
  if(!input) return;
  const val = input.value;
  clearInterval(state.timerId);
  state.locked=true;
  const q = ALL[state.currentIndex];
  const trimmed = val.trim();
  const norm = normalize(val);
  const correct = trimmed!=='' && q.answers.some(a=>normalize(a)===norm);
  state.answers[state.currentIndex] = { status: trimmed===''? 'unanswered' : (correct?'correct':'incorrect'), userText:val, part:q.part };
  render();
}
function idKeydown(e){ if(e.key==='Enter'){ e.preventDefault(); submitIdentification(); } }
function nextQuestion(){
  const finished = state.currentIndex;
  state.locked=false;
  if(finished===MC_END){ state.screen='transition'; render(); return; }
  if(finished===LAST){ state.screen='results'; render(); return; }
  state.currentIndex++; state.screen='quiz'; render();
  if(state.timerEnabled) startTimer();
}
function continueFromTransition(){
  state.currentIndex++; state.screen='quiz'; state.locked=false; render();
  if(state.timerEnabled) startTimer();
}
function confirmRestart(){
  if(state.screen==='start') return;
  if(window.confirm('Restart the quiz? Your current progress will be cleared.')) restartQuiz();
}
function restartQuiz(){ clearInterval(state.timerId); state = freshState(); render(); }

/* ===================== RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  if(state.screen==='start') app.innerHTML = startScreen();
  else if(state.screen==='quiz') app.innerHTML = quizScreen();
  else if(state.screen==='transition') app.innerHTML = transitionScreen();
  else app.innerHTML = resultsScreen();

  if(state.screen==='quiz'){
    updateTimerDOM();
    if(!state.locked){
      const q = ALL[state.currentIndex];
      if(q.part==='id'){ const input = document.getElementById('idInput'); if(input) input.focus(); }
    }
  }
}

function startScreen(){
  return `
    <div class="start-wrap">
      <div class="eyebrow"><span class="part-tag">GEED 003 · The Contemporary World</span><span>Lesson 2.2</span></div>
      <h1 class="headline">Mock Quiz: The New World Order</h1>
      <p class="lede">A practice run for Long Summative Quiz #2, built from your handout and lecture notes — including extra focus on the UN's five active organs and the Security Council's permanent members. Answer, and you'll immediately see whether you got it right, with a short explanation. At the end you'll get a full breakdown of every item so you know exactly what to review.</p>
      <div class="part-list">
        <div class="part-row"><span>Part I — Multiple Choice</span><span class="n">${MC_COUNT} items · ${MC_TIME}s each (~8 min)</span></div>
        <div class="part-row"><span>Part II — Identification (type your answer)</span><span class="n">${ID_COUNT} items · ${ID_TIME}s each (~7.5 min)</span></div>
      </div>
      <p class="lede" style="margin-top:-10px;font-size:13px;">Of these, 15 MC + 10 identification items focus specifically on the UN's active organs and the Security Council's permanent members, as advised. Identification answers are designed to be one word (often an acronym) each.</p>
      <div class="toggle-row">
        <input type="checkbox" id="timerToggle" checked>
        <label for="timerToggle">Time me — ${MC_TIME}s per MC question, ${ID_TIME}s per identification question, just like the real quiz (uncheck for untimed practice)</label>
      </div>
      <button class="btn btn-block" onclick="startQuiz()">Start Quiz</button>
    </div>
  `;
}

function timerWidget(){
  if(!state.timerEnabled || state.locked) return '';
  const q = ALL[state.currentIndex];
  const max = timeLimitFor(q);
  return `
    <div class="timer-row">
      <div class="timer-wrap">
        <span>Time left</span>
        <svg width="30" height="30" viewBox="0 0 60 60" class="timer-ring-svg">
          <circle class="timer-ring-bg" cx="30" cy="30" r="26"></circle>
          <circle id="timerRingFg" class="timer-ring-fg" cx="30" cy="30" r="26"></circle>
          <text x="30" y="34" text-anchor="middle" transform="rotate(90 30 30)" class="timer-num" id="timerSeconds">${max}</text>
        </svg>
      </div>
    </div>
  `;
}

function quizScreen(){
  const q = ALL[state.currentIndex];
  const a = state.answers[state.currentIndex];
  const overallPct = Math.round((state.currentIndex/TOTAL)*100);

  let optionsHtml = '';
  if(q.part==='id'){
    optionsHtml = `
      <div class="id-row">
        <input type="text" id="idInput" class="id-input" placeholder="Type your one-word answer…"
          ${state.locked?'disabled':''} onkeydown="idKeydown(event)">
        <button class="btn" ${state.locked?'disabled':''} onclick="submitIdentification()">Check answer</button>
      </div>
    `;
  } else {
    optionsHtml = `<div class="options-col">` + q.options.map((opt,i)=>{
      const letter = String.fromCharCode(65+i);
      let cls='opt'; let tag='';
      if(state.locked){
        cls += ' locked-opt';
        if(a && a.userIndex===i && i===q.correct){ cls+=' opt-correct'; tag='<span class="tag-right">Your answer · Correct</span>'; }
        else if(a && a.userIndex===i && i!==q.correct){ cls+=' opt-incorrect'; tag='<span class="tag-yours">Your answer</span>'; }
        else if(i===q.correct){ cls+=' opt-reveal'; tag='<span class="tag-right">Correct answer</span>'; }
      }
      return `<div class="${cls}" ${state.locked?'':`onclick="selectOption(${i})"`}>
        <span class="mark">${letter}</span><span>${escapeHtml(opt)}</span>${tag}
      </div>`;
    }).join('') + `</div>`;
  }

  let feedbackHtml = '';
  if(state.locked){
    const status = a.status;
    const isCorrect = status==='correct';
    const headText = status==='correct' ? 'Correct!' : (status==='unanswered' ? "Time's up!" : 'Not quite.');
    let extraLine = '';
    if(q.part==='id'){
      const yourText = a.userText && a.userText.trim() ? escapeHtml(a.userText) : '(no answer)';
      extraLine = `<div style="margin-bottom:6px;"><b style="color:var(--chalk)">Your answer:</b> ${yourText} &nbsp;·&nbsp; <b style="color:var(--chalk)">Correct answer:</b> ${escapeHtml(q.display)}</div>`;
    }
    feedbackHtml = `
      <div class="feedback ${isCorrect?'correct':'incorrect'}">
        <div class="feedback-head">${headText}</div>
        <div class="feedback-body">${extraLine}${escapeHtml(q.exp)}</div>
        <div class="feedback-actions">
          <button class="btn" onclick="nextQuestion()">${state.currentIndex===LAST ? 'See my results' : 'Next question'}</button>
        </div>
      </div>
    `;
  }

  const unTagNote = q.tag==='un' ? `<div class="review-tagline" style="margin-bottom:6px;">★ UN organs / Security Council focus</div>` : '';

  return `
    <div class="eyebrow">
      <span><span class="part-tag">${q.partLabel}</span> · Question ${q.numberInPart} of ${q.totalInPart}</span>
      <button class="restart-link" onclick="confirmRestart()">↺ Restart</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${overallPct}%"></div></div>
    ${timerWidget()}
    ${unTagNote}
    <div class="prompt">${escapeHtml(q.q)}</div>
    ${optionsHtml}
    ${feedbackHtml}
  `;
}

function transitionScreen(){
  const {correct, total} = scoreForPart('mc');
  const p = pct(correct,total);
  let note;
  if(p>=80) note = "Strong work — that's a solid grasp of Part I.";
  else if(p>=60) note = "Decent run. Skim the review at the end to tighten up the weak spots.";
  else note = "This part needs another pass — keep going, the full review at the end will show you exactly what to revisit.";

  return `
    <div class="transition-wrap">
      <div class="eyebrow" style="justify-content:center;"><span class="part-tag">Part I: Multiple Choice complete</span></div>
      <div class="transition-score">${correct} / ${total}</div>
      <div class="transition-note">${p}% correct — ${note}</div>
      <button class="btn" onclick="continueFromTransition()">Continue to Part II: Identification →</button>
    </div>
  `;
}

function reviewGroup(part, label){
  const items = ALL.map((q,i)=>({q,i})).filter(o=>o.q.part===part);
  const rows = items.map(({q,i})=>{
    const a = state.answers[i];
    const ok = a && a.status==='correct';
    let yourAns, correctAns;
    if(q.part==='id'){
      yourAns = (a && a.userText && a.userText.trim()) ? a.userText : '(no answer)';
      correctAns = q.display;
    } else {
      yourAns = (a && typeof a.userIndex==='number') ? q.options[a.userIndex] : '(no answer)';
      correctAns = q.options[q.correct];
    }
    const star = q.tag==='un' ? '★ ' : '';
    return `
      <div class="review-item ${ok?'ok':'bad'}">
        <div class="review-q">${star}${q.numberInPart}. ${escapeHtml(q.q)}</div>
        <div class="review-meta">${ok?'✓':'✗'} <b>Your answer:</b> ${escapeHtml(yourAns)}${ok?'':`  ·  <b>Correct:</b> ${escapeHtml(correctAns)}`}</div>
      </div>
    `;
  }).join('');
  return `<div class="review-group-label">${label}</div>${rows}`;
}

function resultsScreen(){
  const overall = overallScore();
  const mc = scoreForPart('mc'), id = scoreForPart('id');
  const un = scoreForTag('un');
  return `
    <div class="results-wrap">
      <div class="results-top">
        <div class="eyebrow" style="justify-content:center;"><span class="part-tag">Mock quiz complete</span></div>
        <div class="results-score">${overall.correct} / ${overall.total}</div>
        <div class="results-sub">${pct(overall.correct,overall.total)}% overall</div>
      </div>
      <div class="stat-row">
        <div class="stat-card"><div class="num">${mc.correct}/${mc.total}</div><div class="label">Part I · MC</div></div>
        <div class="stat-card"><div class="num">${id.correct}/${id.total}</div><div class="label">Part II · ID</div></div>
        <div class="stat-card"><div class="num">${un.correct}/${un.total}</div><div class="label">★ UN / Security Council</div></div>
      </div>
      <button class="btn btn-block" onclick="restartQuiz()">Restart quiz</button>
      <div class="review-title">Review your answers</div>
      ${reviewGroup('mc','Part I — Multiple Choice')}
      ${reviewGroup('id','Part II — Identification')}
      <div class="bottom-actions">
        <button class="btn btn-ghost btn-block" onclick="restartQuiz()">↺ Restart quiz</button>
      </div>
    </div>
  `;
}

/* ===================== INIT ===================== */
render();
</script>
</body>
</html>
